name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 最小权限：构建产物不回写仓库；发布需要写 contents
permissions:
  contents: write

# 同分支新推送取消旧构建，省额度
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Debug 包自带调试签名，无需 keystore.properties；同时编译 commonMain（含桌面共享 UI）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 快速编译闸门：只编译 Kotlin（不打包/dex），失败时比全量构建更快反馈
  compile-check:
    name: Kotlin Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDebugKotlinAndroid --no-daemon --stacktrace

  # 正式签名包：密钥经仓库 Secrets 注入（PIXO_KEYSTORE_BASE64 / PIXO_KEYSTORE_PASSWORD /
  # PIXO_KEY_ALIAS / PIXO_KEY_PASSWORD），未配置时跳过 release 构建
  release:
    name: Android Release APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & verify signed release APK
        env:
          KS_B64: ${{ secrets.PIXO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.PIXO_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PIXO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PIXO_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置签名密钥 Secrets，跳过 release 构建（仅 debug 出包）"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > pixo-keystore.jks
          printf 'storeFile=../pixo-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "== 签名校验 =="
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ===== 读取版本号 =====
      - name: 读取版本号
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '[0-9.]+')
          echo "version=$VN" >> $GITHUB_ENV

      # ===== 正式版 Release（幂等覆盖同名，版本=versionName）=====
      - name: 组合正式版产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/pixo-${version}-release.apk"

      - name: 下载 debug APK（并入正式版）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: pixo-debug-apk
          path: dist
          merge-multiple: true

      - name: 发布正式版 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la dist/
          # release 已在「组合正式版产物」命名为 pixo-${version}-release.apk；
          # debug 从 artifact 下载（app-debug.apk），重命名为 pixo-${version}-debug.apk
          DBG=$(find dist -name 'app-debug.apk' | head -1)
          if [ -n "$DBG" ]; then mv "$DBG" "dist/pixo-${version}-debug.apk"; fi
          gh release delete "v${version}" --yes --cleanup-tag || true
          gh release create "v${version}" dist/*.apk \
            --title "Pixo v${version}" \
            --notes "正式版：包含全部已发布更新（评论表情/追评/标签屏蔽/历史/WebDAV/关注新作/相关推荐等）。"
