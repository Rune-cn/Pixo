# Pixo CI
#
# 用法（日常只需要看这三条）：
#   1) 日常开发：push 到 main 或开 PR
#      → 只构建 + 跑测试（Android 编译、桌面端编译、单测、签名 release 包）
#      → 产物在 Actions 的 artifacts 里，不会产生 Release
#   2) 预发布（nightly）：
#      Actions → Build → Run workflow → 勾选 publish_nightly
#      → 生成 nightly-YYYYMMDD（pre-release，同日重跑会覆盖）
#   3) 正式版：
#      先把 app/build.gradle.kts 的 versionCode / versionName 改好并推送
#      → Actions → Build → Run workflow（不要勾 publish_nightly）
#      → 从该次 artifact 里取 4 个 ABI 的签名包，创建 vX.Y.Z Release
#
# 约定：发布开关只有 release job 的 PUBLISH_NIGHTLY 一处定义，
#       三个发布步骤共用，改条件时不用逐个改。
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: '构建后发布为 nightly 预发布（默认只构建，不发版）'
        type: boolean
        default: false

# 最小权限：构建产物不回写仓库；发布需要写 contents
permissions:
  contents: write

# 同分支新推送取消旧构建，省额度
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Debug 包自带调试签名，无需 keystore.properties；同时编译 commonMain（含桌面共享 UI）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 快速编译闸门：只编译 Kotlin（不打包/dex），失败时比全量构建更快反馈
  compile-check:
    name: Kotlin Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDebugKotlinAndroid --no-daemon --stacktrace


  # 桌面端（JVM）编译 + 纯逻辑单测：CI 之前只编 Android，
  # desktopMain 编译坏掉只能在本地发现（历史 commit 里已出现两次）。
  desktop-check:
    name: Desktop Compile + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile desktop target
        run: ./gradlew :app:compileKotlinDesktop --no-daemon --stacktrace

      - name: Run common unit tests
        run: ./gradlew :app:desktopTest --no-daemon --stacktrace

  # 正式签名包：密钥经仓库 Secrets 注入（PIXO_KEYSTORE_BASE64 / PIXO_KEYSTORE_PASSWORD /
  # PIXO_KEY_ALIAS / PIXO_KEY_PASSWORD），未配置时跳过 release 构建
  release:
    name: Android Release APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 发布开关只有这一处定义：手动触发且勾选 publish_nightly 才发预发布；
    # push / PR 只构建产物（artifact），不产生 Release。
    env:
      PUBLISH_NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_nightly }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & verify signed release APK
        env:
          KS_B64: ${{ secrets.PIXO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.PIXO_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PIXO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PIXO_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置签名密钥 Secrets，跳过 release 构建（仅 debug 出包）"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > pixo-keystore.jks
          printf 'storeFile=../pixo-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "== 签名校验 =="
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ===== 读取版本号 =====
      - name: 读取版本号
        if: env.PUBLISH_NIGHTLY == 'true'
        run: |
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '[0-9.]+')
          echo "version=$VN" >> $GITHUB_ENV

      # ===== 预发布产物（仅 publish_nightly=true 时）=====
      - name: 组合正式版产物
        if: env.PUBLISH_NIGHTLY == 'true'
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            # 文件名形如 app-arm64-v8a-release.apk / app-release.apk
            abi=$(echo "$base" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            [ "$abi" = "$base" ] && abi="universal"
            cp "$apk" "dist/pixo-${version}-${abi}-release.apk"
          done

      - name: 发布午夜版（手动触发且勾选 publish_nightly）
        if: env.PUBLISH_NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la dist/
          # release 已在「组合正式版产物」命名为 pixo-${version}-release.apk；
          # debug 从 artifact 下载（app-debug.apk），重命名为 pixo-${version}-debug.apk
          DBG=$(find dist -name 'app-debug.apk' | head -1)
          if [ -n "$DBG" ]; then mv "$DBG" "dist/pixo-${version}-debug.apk"; fi
          # tag = nightly-YYYYMMDD（UTC 日期），pre-release，同日重跑会覆盖
          DATE=$(date -u +%Y%m%d)
          TAG="nightly-${DATE}"
          for apk in dist/pixo-*-release.apk; do
            [ -f "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/.*pixo-[^-]+-(.*)-release\.apk$/\1/')
            mv "$apk" "dist/pixo-nightly-${DATE}-${abi}.apk"
          done
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk \
            --title "Pixo 午夜版 ${DATE}" \
            --notes "每日午夜自动构建（版本 ${version}，commit ${GITHUB_SHA::7}）。" \
            --prerelease
