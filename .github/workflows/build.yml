name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 最小权限：仅读取代码，构建产物不回写仓库
permissions:
  contents: read

# 同分支新推送取消旧构建，省额度
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Debug 包自带调试签名，无需 keystore.properties；同时编译 commonMain（含桌面共享 UI）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 快速编译闸门：只编译 Kotlin（不打包/dex），失败时比全量构建更快反馈
  compile-check:
    name: Kotlin Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDebugKotlinAndroid --no-daemon --stacktrace
